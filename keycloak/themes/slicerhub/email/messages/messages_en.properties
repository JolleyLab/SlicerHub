# SlicerHub wording for Keycloak's emails. Java MessageFormat: '' is a literal apostrophe.
# {0} link, {1} expiry in minutes, {2} realm name ("SlicerHub"), {3}/{4} see each message.

# Verify email — sent after registering on Keycloak's page. {3} = expiry ("12 hours")
emailVerificationSubject=Verify your SlicerHub email address
emailVerificationBody=Hi,\n\nPlease confirm this email address for your {2} account:\n\n{0}\n\nThis link expires in {3}.\n\nIf you didn''t create a {2} account, you can safely ignore this email.
emailVerificationBodyHtml=<p>Hi,</p><p>Please confirm this email address for your <strong>{2}</strong> account.</p><p><a href="{0}">Verify your email address</a></p><p>This link expires in {3}.</p><p style="color:#555;font-size:13px;">If you didn''t create a {2} account, you can safely ignore this email.</p>

# Password reset — {3} = expiry
passwordResetSubject=Reset your SlicerHub password
passwordResetBody=Hi,\n\nWe received a request to reset the password for your {2} account. Choose a new password here:\n\n{0}\n\nThis link expires in {3}.\n\nIf you didn''t ask to reset your password, you can ignore this email and your password won''t change.
passwordResetBodyHtml=<p>Hi,</p><p>We received a request to reset the password for your <strong>{2}</strong> account.</p><p><a href="{0}">Choose a new password</a></p><p>This link expires in {3}.</p><p style="color:#555;font-size:13px;">If you didn''t ask to reset your password, you can ignore this email and your password won''t change.</p>

# Account setup — Keycloak's "execute actions" email. SlicerHub sends it when someone is
# invited to a case and has no account yet; admins can also send it from the admin console,
# so the wording works for both. {3} = the steps, {4} = expiry
executeActionsSubject=Set up your SlicerHub account
executeActionsBody=Hi,\n\nTo use your {2} account, please complete these steps: {3}.\n\n{0}\n\nThis link expires in {4}. If you were invited to a case, you''ll see it after you sign in.\n\nIf you weren''t expecting this, you can ignore this email.
executeActionsBodyHtml=<p>Hi,</p><p>To use your <strong>{2}</strong> account, please complete these steps: {3}.</p><p><a href="{0}">Set up your account</a></p><p>This link expires in {4}. If you were invited to a case, you''ll see it after you sign in.</p><p style="color:#555;font-size:13px;">If you weren''t expecting this, you can ignore this email.</p>

requiredAction.UPDATE_PASSWORD=Choose a password
requiredAction.VERIFY_EMAIL=Confirm your email address

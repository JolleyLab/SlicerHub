# SlicerHub login theme: Keycloak's own keycloak.v2 theme (PatternFly 5, maintained
# by the Keycloak team) with SlicerHub's look on top. Only CSS, one small script and
# message overrides — no template copies, so Keycloak upgrades keep working.
# Colours mirror dev/components/theme.js; dark-mode values that fell short of WCAG 2.1
# AA contrast are adjusted here (see css/slicerhub.css).
parent=keycloak.v2
import=common/keycloak

# css/styles.css is the parent theme's (resolved through the parent chain).
styles=css/styles.css css/slicerhub.css
scripts=js/slicerhub-theme.js

<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lit Element Playground</title>
    <link rel="preconnect" href="https://rsms.me/" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />

    <script type="importmap">
        {
            "imports": {
                "lit-element": "https://unpkg.com/lit-element@2.5.1/lit-element.js?module"
            }
        }
    </script>

    <style>
        :root {
            --font-family-base: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-feature-defaults: 'liga' 1, 'calt' 1;
            font-family: var(--font-family-base);
            font-feature-settings: var(--font-feature-defaults);
            color: var(--color-text-primary, #222222);
            background: var(--color-background, #f5f5f5);
        }

        @supports (font-variation-settings: normal) {
            :root {
                --font-family-base: InterVariable, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            }
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--color-background, #f5f5f5);
            color: var(--color-text-primary, #222222);
            padding: 16px;
            box-sizing: border-box;
        }

        .page-layout {
            display: grid;
            grid-template-columns: 240px minmax(0, 1fr);
            gap: 16px;
            align-items: start;
        }

        .left-rail {
            align-self: start;
        }

        .playground-shell {
            width: 100%;
            max-width: 960px;
            background: var(--color-surface, #ffffff);
            border: 1px solid var(--color-border, #dddddd);
            border-radius: var(--radius-lg, 8px);
            padding: 20px;
            box-shadow: 0 6px 18px var(--color-shadow, rgba(0, 0, 0, 0.1));
        }

        .layout-preview {
            display: grid;
            grid-template-columns: 220px 1fr;
            gap: 16px;
            margin-top: 16px;
            align-items: start;
        }

        .preview-content {
            border: 1px dashed var(--color-border, #dddddd);
            border-radius: var(--radius-lg, 8px);
            min-height: 160px;
            padding: 16px;
            color: var(--color-text-secondary, #555555);
            background: color-mix(in srgb, var(--color-background, #f5f5f5) 92%, white 8%);
        }

        @media (max-width: 640px) {
            .page-layout {
                grid-template-columns: 1fr;
            }

            .left-rail {
                position: static;
            }

            .layout-preview {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!--<my-projects-empty-state username="Local Tester"></my-projects-empty-state>-->
    <create-project-form username="Local Tester"></create-project-form>

    <script type="module">
        // Development-only mock API for playground testing.
        // This file is not used by the production app runtime.
        const MOCK_USERS_BY_EMAIL = {
            'alex@example.com': { id: 101, username: 'alex', email: 'alex@example.com' },
            'jamie@example.com': { id: 102, username: 'jamie', email: 'jamie@example.com' }
        };

        // Intercept only collaborator lookup requests in playground.
        // All other requests continue to use the browser's normal fetch.
        const originalFetch = window.fetch.bind(window);

        window.fetch = async (input, init = {}) => {
            const requestUrl = typeof input === 'string' ? input : input.url;
            const method = (init.method || 'GET').toUpperCase();

            if (method === 'GET' && requestUrl.includes('/api/users/lookup')) {
                const url = new URL(requestUrl, window.location.origin);
                const email = (url.searchParams.get('email') || '').trim();

                if (!email) {
                    return new Response(JSON.stringify({
                        error: { message: 'Email is required', status: 400 }
                    }), {
                        status: 400,
                        headers: { 'Content-Type': 'application/json' }
                    });
                }

                const user = MOCK_USERS_BY_EMAIL[email];
                if (!user) {
                    return new Response(JSON.stringify({
                        error: { message: 'No matching user found', status: 404 }
                    }), {
                        status: 404,
                        headers: { 'Content-Type': 'application/json' }
                    });
                }

                return new Response(JSON.stringify({ user }), {
                    status: 200,
                    headers: { 'Content-Type': 'application/json' }
                });
            }

            return originalFetch(input, init);
        };
    </script>
    <script type="module" src="./components/theme.js"></script>
    <script type="module" src="./MyProjects/myProjectsEmptyState.js"></script>
    <script type="module" src="./MyProjects/createProjectForm.js"></script>
</body>
</html>

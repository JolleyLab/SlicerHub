<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lit Element Playground</title>
    <link rel="preconnect" href="https://rsms.me/" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />

    <script type="importmap">
        {
            "imports": {
                "lit-element": "https://unpkg.com/lit-element@2.5.1/lit-element.js?module"
            }
        }
    </script>

    <style>
        :root {
            --font-family-base: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-feature-defaults: 'liga' 1, 'calt' 1;
            font-family: var(--font-family-base);
            font-feature-settings: var(--font-feature-defaults);
            color: var(--color-text-primary, #222222);
            background: var(--color-background, #f5f5f5);
        }

        @supports (font-variation-settings: normal) {
            :root {
                --font-family-base: InterVariable, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            }
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--color-background, #f5f5f5);
            color: var(--color-text-primary, #222222);
            padding: 24px;
            box-sizing: border-box;
        }

        .playground-shell {
            max-width: 720px;
            margin: 0 auto;
            background: var(--color-surface, #ffffff);
            border: 1px solid var(--color-border, #dddddd);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 6px 18px var(--color-shadow, rgba(0, 0, 0, 0.1));
        }
    </style>
</head>
<body>
    <div class="playground-shell">
        <h2>Lit Playground</h2>
        <p>Use this page to test local components without running the whole app.</p>
        <user-menu username="Local Tester"></user-menu>
    </div>

    <script type="module" src="./theme.js"></script>
    <script type="module" src="./user-menu.js"></script>
</body>
</html>

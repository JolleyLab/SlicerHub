<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Opening viewer…</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0c0c14;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      overflow: hidden;
    }
    #viewer {
      position: absolute;
      inset: 0;
      border: 0;
      width: 100%;
      height: 100%;
      background: #0c0c14;
      /* Keep VNC painting, but hide it until ready to avoid flash of prior scene */
      opacity: 0;
      pointer-events: none;
    }
    #viewer.visible {
      opacity: 1;
      pointer-events: auto;
    }
    #splash {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #0c0c14;
      color: #e8e8ef;
      text-align: center;
      padding: 24px;
    }
    #splash h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 600;
    }
    #splash p {
      margin: 0;
      color: #9aa0b4;
      font-size: 0.95rem;
    }
    #splash.hidden {
      display: none;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid #2a2a3a;
      border-top-color: #c7c9d9;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 8px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="splash">
    <div class="spinner" aria-hidden="true"></div>
    <h1 id="title">Opening viewer…</h1>
    <p id="subtitle">Please wait while the scene loads.</p>
  </div>
  <iframe id="viewer" title="Full Slicer viewer" allow="fullscreen"></iframe>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const projectId = params.get('projectId') || '';
      const fileName = params.get('fileName') || '';
      const simplified = params.get('simplified') === '1';
      const vncPath = params.get('vnc') || '/slicer-gui/vnc.html?autoconnect=true&resize=scale';

      const splash = document.getElementById('splash');
      const title = document.getElementById('title');
      const subtitle = document.getElementById('subtitle');
      const viewer = document.getElementById('viewer');

      if (fileName) {
        title.textContent = simplified
          ? 'Opening simplified viewer…'
          : 'Opening Full Slicer…';
        subtitle.textContent = 'Loading ' + fileName;
      } else if (simplified) {
        title.textContent = 'Opening simplified viewer…';
      }

      // Start VNC behind the splash immediately so connection warms up.
      viewer.src = vncPath;

      const startedAt = Date.now();
      const maxWaitMs = 90000;
      const minSplashMs = 900;
      let sawBusy = false;
      let revealed = false;

      function reveal() {
        if (revealed) return;
        revealed = true;
        viewer.classList.add('visible');
        splash.classList.add('hidden');
      }

      async function checkStatus() {
        if (!projectId) {
          // Fallback: timed reveal if status API is unavailable.
          if (Date.now() - startedAt > 3500) reveal();
          return;
        }
        try {
          const response = await fetch(
            '/api/projects/' + encodeURIComponent(projectId) + '/gpu/full-slicer-status',
            { credentials: 'include', cache: 'no-store' }
          );
          if (!response.ok) {
            if (Date.now() - startedAt > 5000) reveal();
            return;
          }
          const data = await response.json();
          if (data.busy) {
            sawBusy = true;
            return;
          }
          // Reveal only after we observed busy and it cleared, or after timeout.
          const waitedLongEnough = Date.now() - startedAt >= minSplashMs;
          if ((sawBusy || Date.now() - startedAt > 4000) && waitedLongEnough) {
            reveal();
          }
        } catch (_) {
          if (Date.now() - startedAt > 5000) reveal();
        }
      }

      const poll = setInterval(async () => {
        if (revealed) {
          clearInterval(poll);
          return;
        }
        if (Date.now() - startedAt > maxWaitMs) {
          reveal();
          clearInterval(poll);
          return;
        }
        await checkStatus();
      }, 400);

      checkStatus();
    })();
  </script>
</body>
</html>

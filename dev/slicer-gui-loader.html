<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Opening viewer…</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0c0c14;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      overflow: hidden;
    }
    #viewer {
      position: absolute;
      inset: 0;
      border: 0;
      width: 100%;
      height: 100%;
      background: #0c0c14;
      opacity: 0;
      pointer-events: none;
    }
    #viewer.visible {
      opacity: 1;
      pointer-events: auto;
    }
    #splash {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #0c0c14;
      color: #e8e8ef;
      text-align: center;
      padding: 24px;
    }
    #splash h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 600;
    }
    #splash p {
      margin: 0;
      color: #9aa0b4;
      font-size: 0.95rem;
    }
    #splash.hidden {
      display: none;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid #2a2a3a;
      border-top-color: #c7c9d9;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 8px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="splash">
    <div class="spinner" aria-hidden="true"></div>
    <h1 id="title">Opening viewer…</h1>
    <p id="subtitle">Please wait while the scene loads.</p>
  </div>
  <iframe id="viewer" title="Full Slicer viewer" allow="fullscreen"></iframe>
  <script type="module" src="./slicer-gui-loader.js"></script>
  <noscript>
    <p style="color:#e8e8ef;text-align:center;padding:24px">JavaScript is required to open the viewer.</p>
  </noscript>
</body>
</html>

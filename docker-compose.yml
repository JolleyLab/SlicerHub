services:
  # Session image: same TRAME_IMAGE for build tag and for trame-service (avoids remote "wrong image" drift).
  # Override in `.env`, e.g. TRAME_IMAGE=slicer-web-trame:dev-savebtn then: docker compose build trame-job
  trame-job:
    build: ./trame-server
    image: ${TRAME_IMAGE:-slicer-web-trame:local}
    container_name: trame-job
    environment:
      VTK_DEFAULT_OPENGL_WINDOW: vtkEGLRenderWindow
      VTK_USE_X: "0"
      DISPLAY: ""
    networks:
      - trame-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    runtime: nvidia

  # Trame session manager service
  trame-service:
    build: ./trame-service
    container_name: trame-service
    ports:
      # Localhost only — demo users reach the app via nginx:8000, not these ports.
      - "127.0.0.1:8090:8090"
      # Viewer ports 9000-9009 are published by per-session containers (docker runtime)
      # or by the process-mode trame-service container (see scripts/local preflight).
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/workspace
      - ./trame-service:/app
    environment:
      - USE_GPU=true
      # Local stack: always docker (spawns slicer-web-trame session containers).
      # Process mode is for Vast GPU nodes only — not the slim trame-service image.
      - TRAME_SESSION_RUNTIME=docker
      # Sliding lease: renewed by browser heartbeat + Trame API activity (default 1800s if unset).
      - SESSION_TTL_SECONDS=${SESSION_TTL_SECONDS:-1800}
      # Hard stop after this many seconds from session start even with heartbeats (0 = off).
      - MAX_SESSION_WALL_SECONDS=${MAX_SESSION_WALL_SECONDS:-28800}
      - PRUNE_EXITED_INTERVAL_SECONDS=${PRUNE_EXITED_INTERVAL_SECONDS:-300}
      - WORKSPACE_ROOT=/workspace
      # Host repo path for nested `docker run -v` (required on Windows Docker Desktop).
      - HOST_WORKSPACE_ROOT=${HOST_WORKSPACE_ROOT:-${PWD}}
      - TRAME_IMAGE=${TRAME_IMAGE:-slicer-web-trame:local}
      # Local dev / smoke-gpu-sync.ps1 (per-instance token used on Vast)
      - TRAME_SYNC_TOKEN=${TRAME_SYNC_TOKEN:-test-sync-token-local}
    networks:
      - trame-net

  # Backend API
  backend:
    build: ./backend
    container_name: backend
    ports:
      # Localhost only — use nginx:8000 or SSH tunnel for direct API access.
      - "127.0.0.1:8081:8080"
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - /app/node_modules  # Prevent host node_modules from overriding container's Linux-compiled modules
      - slicer-backend-data:/app/data
      - ./backend/data:/app/data-seed:ro
      - ./data/slicer-gui:/app/data/slicer-gui
      - ./nginx:/nginx
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - NODE_ENV=development
      - DB_PATH=/app/data/users.db
      - DB_SAVE_DIRECT=true
      - JWT_SECRET=${JWT_SECRET:-please-change-this-to-a-secure-random-string-in-production}
      - GPU_CREDENTIALS_KEY=${GPU_CREDENTIALS_KEY:-}
      - WORKSPACE_ROOT=/workspace
      - TRAME_SERVICE_URL=${TRAME_SERVICE_URL:-http://trame-service:8090}
      - TRAME_VIEWER_PUBLIC_BASE_URL=${TRAME_VIEWER_PUBLIC_BASE_URL:-}
      - TRAME_SESSION_RUNTIME=docker
      - VAST_GPU_IMAGE=${VAST_GPU_IMAGE:-}
      - VAST_GPU_NAME=${VAST_GPU_NAME:-RTX_4090}
      - VAST_MIN_CUDA=${VAST_MIN_CUDA:-}
      - VAST_OFFER_TYPE=${VAST_OFFER_TYPE:-}
      - VAST_SEARCH_JSON=${VAST_SEARCH_JSON:-}
      - VAST_MAX_DPH=${VAST_MAX_DPH:-2.0}
      - VAST_MIN_DISK_GB=${VAST_MIN_DISK_GB:-40}
      - VAST_INSTANCE_LABEL=${VAST_INSTANCE_LABEL:-slicer-web-gpu}
      - VAST_OPEN_PORTS=${VAST_OPEN_PORTS:--p 8090:8090 -p 80:80}
      - VAST_RUNTYPE=${VAST_RUNTYPE:-args}
      - GPU_BILLING_IDLE_MINUTES=${GPU_BILLING_IDLE_MINUTES:-60}
      - GPU_BILLING_MAX_WALL_MINUTES=${GPU_BILLING_MAX_WALL_MINUTES:-480}
      - GPU_VIEWER_SESSION_TTL_SECONDS=${GPU_VIEWER_SESSION_TTL_SECONDS:-1800}
      - GPU_VIEWER_LEAVE_GRACE_MINUTES=${GPU_VIEWER_LEAVE_GRACE_MINUTES:-10}
      - SESSION_TTL_SECONDS=${SESSION_TTL_SECONDS:-1800}
      - GPU_PRESTAGE_MAX_FILES=${GPU_PRESTAGE_MAX_FILES:-3}
      - GPU_PRESTAGE_MAX_MB=${GPU_PRESTAGE_MAX_MB:-500}
      - GPU_PRESTAGE_MAX_FILE_MB=${GPU_PRESTAGE_MAX_FILE_MB:-1024}
    depends_on:
      - trame-job
    networks:
      - trame-net

  # Frontend
  frontend:
    build: ./dev
    container_name: frontend
    # No external port - accessed only via nginx
    volumes:
      - ./dev:/app
      - /app/node_modules
    networks:
      - trame-net

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "8000:80" # Port 8000 is open on Paperspace by default
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend
      - frontend
      - trame-job
    networks:
      - trame-net
  
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    env_file:
      - .env
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TUNNEL_TOKEN}
    restart: unless-stopped
    profiles:
      - cloudflare
    networks:
      - trame-net
    depends_on:
      - nginx

  # Full 3D Slicer desktop + noVNC (optional local GPU viewer).
  # Requires NVIDIA Container Toolkit. VNC auth is off by default (VNC_ALLOW_NO_PASSWORD=true).
  # Start: docker compose --profile slicer-gui up -d slicer-gui
  # Browser: http://localhost:8000/slicer-gui/vnc.html (via nginx) or http://127.0.0.1:6080/vnc.html
  slicer-gui:
    build: ./slicer-gui-gpu
    image: ${SLICER_GUI_IMAGE:-slicer-web-slicer-gui:local}
    container_name: slicer-gui
    profiles:
      - slicer-gui
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      VNC_PASSWORD: ${VNC_PASSWORD:-}
      VNC_ALLOW_NO_PASSWORD: ${VNC_ALLOW_NO_PASSWORD:-true}
      DISPLAY_WIDTH: ${SLICER_GUI_DISPLAY_WIDTH:-1920}
      DISPLAY_HEIGHT: ${SLICER_GUI_DISPLAY_HEIGHT:-1080}
      CLOUDFLARE_TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    ports:
      - "127.0.0.1:6080:6080"
      - "127.0.0.1:5901:5901"
    volumes:
      - slicer-gui-home:/home/slicer
      - ./data/slicer-gui:/home/slicer/data
      - /dev/shm:/dev/shm
    cap_add:
      - SYS_PTRACE
    shm_size: 8gb
    stdin_open: true
    tty: true
    restart: unless-stopped
    networks:
      - trame-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

networks:
  trame-net:
    name: trame-net
    driver: bridge

volumes:
  slicer-backend-data:
  slicer-gui-home:

services:
  # Session image: same TRAME_IMAGE for build tag and for trame-service (avoids remote "wrong image" drift).
  # Override in `.env`, e.g. TRAME_IMAGE=slicer-web-trame:dev-savebtn then: docker compose build trame-job
  trame-job:
    build: ./trame-server
    image: ${TRAME_IMAGE:-slicer-web-trame:local}
    container_name: trame-job
    environment:
      VTK_DEFAULT_OPENGL_WINDOW: vtkEGLRenderWindow
      VTK_USE_X: "0"
      DISPLAY: ""
    networks:
      - trame-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    runtime: nvidia

  # Trame session manager service
  trame-service:
    build: ./trame-service
    container_name: trame-service
    ports:
      # Localhost only — demo users reach the app via nginx:8000, not these ports.
      - "127.0.0.1:8090:8090"
      # Viewer ports 9000-9009 are published by per-session containers (docker runtime)
      # or by the process-mode trame-service container (see scripts/local preflight).
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/workspace
      - ./trame-service:/app
    environment:
      - USE_GPU=true
      # Local stack: always docker (spawns slicer-web-trame session containers).
      # Process mode is for Vast GPU nodes only — not the slim trame-service image.
      - TRAME_SESSION_RUNTIME=docker
      # Sliding lease: renewed by browser heartbeat + Trame API activity (default 1800s if unset).
      - SESSION_TTL_SECONDS=${SESSION_TTL_SECONDS:-1800}
      # Hard stop after this many seconds from session start even with heartbeats (0 = off).
      - MAX_SESSION_WALL_SECONDS=${MAX_SESSION_WALL_SECONDS:-28800}
      - PRUNE_EXITED_INTERVAL_SECONDS=${PRUNE_EXITED_INTERVAL_SECONDS:-300}
      - WORKSPACE_ROOT=/workspace
      # Host repo path for nested `docker run -v` (required on Windows Docker Desktop).
      - HOST_WORKSPACE_ROOT=${HOST_WORKSPACE_ROOT:-${PWD}}
      - TRAME_IMAGE=${TRAME_IMAGE:-slicer-web-trame:local}
      # Local dev / smoke-gpu-sync.ps1 (per-instance token used on Vast)
      - TRAME_SYNC_TOKEN=${TRAME_SYNC_TOKEN:-test-sync-token-local}
    networks:
      - trame-net

  # Backend API
  backend:
    build: ./backend
    container_name: backend
    ports:
      # Localhost only — use nginx:8000 or SSH tunnel for direct API access.
      - "127.0.0.1:8081:8080"
    env_file:
      - .env
    volumes:
      - ./backend:/app
      # Named volume so npm deps persist and can be refreshed (anonymous volumes go stale after package.json changes)
      - backend-node-modules:/app/node_modules
      - slicer-backend-data:/app/data
      - ./backend/data:/app/data-seed:ro
      - ./data/slicer-gui:/app/data/slicer-gui
      - ./data/slicer-addons:/app/data/slicer-addons
      - ./nginx:/nginx
      - /var/run/docker.sock:/var/run/docker.sock
    # Re-install when a new lockfile dep is missing from the volume (e.g. nodemailer)
    command: ["sh", "-c", "test -d node_modules/nodemailer && test -d node_modules/heic-convert || npm ci; exec node src/server.js"]
    environment:
      - NODE_ENV=development
      - DB_PATH=/app/data/users.db
      - DB_SAVE_DIRECT=true
      - JWT_SECRET=${JWT_SECRET:-please-change-this-to-a-secure-random-string-in-production}
      - GPU_CREDENTIALS_KEY=${GPU_CREDENTIALS_KEY:-}
      - WORKSPACE_ROOT=/workspace
      - TRAME_SERVICE_URL=${TRAME_SERVICE_URL:-http://trame-service:8090}
      - TRAME_VIEWER_PUBLIC_BASE_URL=${TRAME_VIEWER_PUBLIC_BASE_URL:-}
      - TRAME_SESSION_RUNTIME=docker
      - VAST_GPU_IMAGE=${VAST_GPU_IMAGE:-}
      - VAST_GPU_NAME=${VAST_GPU_NAME:-RTX_4090}
      - VAST_MIN_CUDA=${VAST_MIN_CUDA:-}
      - VAST_OFFER_TYPE=${VAST_OFFER_TYPE:-}
      - VAST_SEARCH_JSON=${VAST_SEARCH_JSON:-}
      - VAST_MAX_DPH=${VAST_MAX_DPH:-2.0}
      - VAST_MIN_DISK_GB=${VAST_MIN_DISK_GB:-40}
      - VAST_INSTANCE_LABEL=${VAST_INSTANCE_LABEL:-slicer-web-gpu}
      - VAST_OPEN_PORTS=${VAST_OPEN_PORTS:--p 8090:8090 -p 80:80}
      - VAST_RUNTYPE=${VAST_RUNTYPE:-args}
      - GPU_BILLING_IDLE_MINUTES=${GPU_BILLING_IDLE_MINUTES:-60}
      - GPU_BILLING_MAX_WALL_MINUTES=${GPU_BILLING_MAX_WALL_MINUTES:-480}
      - GPU_VIEWER_SESSION_TTL_SECONDS=${GPU_VIEWER_SESSION_TTL_SECONDS:-1800}
      - GPU_VIEWER_LEAVE_GRACE_MINUTES=${GPU_VIEWER_LEAVE_GRACE_MINUTES:-10}
      - SESSION_TTL_SECONDS=${SESSION_TTL_SECONDS:-1800}
      - GPU_PRESTAGE_MAX_FILES=${GPU_PRESTAGE_MAX_FILES:-3}
      - GPU_PRESTAGE_MAX_MB=${GPU_PRESTAGE_MAX_MB:-500}
      - GPU_PRESTAGE_MAX_FILE_MB=${GPU_PRESTAGE_MAX_FILE_MB:-1024}
      # Host repo path for nested `docker run -v` (Windows Docker Desktop / DinD binds).
      - HOST_WORKSPACE_ROOT=${HOST_WORKSPACE_ROOT:-${PWD}}
      - SLICER_GUI_IMAGE=${SLICER_GUI_IMAGE:-slicer-web-slicer-gui:local}
      - SLICER_GUI_NETWORK=${SLICER_GUI_NETWORK:-trame-net}
      # Dev only: bind-mount host launch-slicer.sh / slicer_session.py into seats.
      # Leave off in production — Linux host scripts are often non-executable (exit 126).
      - SLICER_GUI_MOUNT_DEV_SCRIPTS=${SLICER_GUI_MOUNT_DEV_SCRIPTS:-false}
      - SLICER_GUI_READY_TIMEOUT_MS=${SLICER_GUI_READY_TIMEOUT_MS:-180000}
      - SLICER_GUI_REUSE_READY_TIMEOUT_MS=${SLICER_GUI_REUSE_READY_TIMEOUT_MS:-15000}
      # Attached Full Slicer lease TTL. Keep comfortably above browser timer throttling
      # (Edge Sleeping Tabs can pause setInterval for minutes). Heartbeats every 30s.
      - SLICER_GUI_SESSION_TTL_SECONDS=${SLICER_GUI_SESSION_TTL_SECONDS:-900}
      # Soft-close warm seat idle window (Full Slicer keep-alive after Close).
      - SLICER_GUI_WARM_IDLE_SECONDS=${SLICER_GUI_WARM_IDLE_SECONDS:-1800}
      # Concurrent Full Slicer desktops per user (desktop + iPad, etc.).
      - SLICER_GUI_MAX_SEATS_PER_USER=${SLICER_GUI_MAX_SEATS_PER_USER:-2}
      - VIEWER_SESSION_TTL_SECONDS=${VIEWER_SESSION_TTL_SECONDS:-120}
      - VIEWER_SESSION_WATCHDOG_INTERVAL_MS=${VIEWER_SESSION_WATCHDOG_INTERVAL_MS:-30000}
      - SLICER_GUI_WATCHDOG_INTERVAL_MS=${SLICER_GUI_WATCHDOG_INTERVAL_MS:-30000}
      - SLICER_HEART_VIEWER_LOCAL_PATH=${SLICER_HEART_VIEWER_LOCAL_PATH:-}
      # Daily-synced addons tree (see slicer-gui-gpu/sync-slicer-addons.py). Empty = image bake only.
      - SLICER_ADDONS_HOST_DIR=${SLICER_ADDONS_HOST_DIR:-}
      - VNC_ALLOW_NO_PASSWORD=${VNC_ALLOW_NO_PASSWORD:-true}
      - SLICER_GUI_DISPLAY_WIDTH=${SLICER_GUI_DISPLAY_WIDTH:-1920}
      - SLICER_GUI_DISPLAY_HEIGHT=${SLICER_GUI_DISPLAY_HEIGHT:-1080}
      # Outbound invite email — off until real SMTP is ready (copy-link still works).
      # Set SMTP_ENABLED=true to use Mailpit locally (UI http://localhost:8025) or production SMTP.
      - SMTP_ENABLED=${SMTP_ENABLED:-false}
      - SMTP_HOST=${SMTP_HOST:-mailpit}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_FROM=${SMTP_FROM:-Case Invites <noreply@localhost>}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL:-http://localhost:8000}
      - CASE_INVITE_TTL_DAYS=${CASE_INVITE_TTL_DAYS:-7}
    depends_on:
      - trame-job
      - mailpit
    networks:
      - trame-net

  # Catch-all SMTP for local invite email testing (UI: http://localhost:8025).
  mailpit:
    image: axllent/mailpit:v1.22
    container_name: mailpit
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    networks:
      - trame-net

  # Frontend
  frontend:
    build: ./dev
    container_name: frontend
    # No external port - accessed only via nginx
    volumes:
      - ./dev:/app
      - frontend-node-modules:/app/node_modules
    # Re-install when a dependency added since the volume was made is missing (e.g. sortablejs)
    command: ["sh", "-c", "test -d node_modules/lit-element && test -d node_modules/sortablejs || npm ci; exec npm run serve -- --host"]
    networks:
      - trame-net

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "8000:80" # Port 8000 is open on Paperspace by default
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
      # Prebuilt SlicerWeb site; populate with scripts/fetch-slicerweb.sh (or .ps1). SLICERWEB_DIR (in
      # .env) moves it, for hosts where ./data is not writable by the user running the script.
      - ${SLICERWEB_DIR:-./data/slicerweb}:/usr/share/slicerweb:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend
      - frontend
      - trame-job
    networks:
      - trame-net
  
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    env_file:
      - .env
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TUNNEL_TOKEN}
    restart: unless-stopped
    profiles:
      - cloudflare
    networks:
      - trame-net
    depends_on:
      - nginx

  # Optional 3D Slicer GUI images used by per-user My Projects Full Slicer sessions.
  # Build: docker compose --profile slicer-gui build slicer-gui-base slicer-gui
  #   (or ./slicer-gui-gpu/build.ps1 / build.sh)
  # Adapter FROM base: set SLICER_GUI_BASE_IMAGE to a Hub tag later and rebuild slicer-gui only.
  # Optional shared debug instance: docker compose --profile slicer-gui up -d slicer-gui
  # Runtime sessions (no profile needed after image build): slicer-gui-{userId}
  #   → http://<host>:8000/slicer-gui/user-{userId}/vnc.html
  slicer-gui-base:
    build:
      context: ./slicer-gui-gpu
      dockerfile: Dockerfile.base
    image: ${SLICER_GUI_BASE_IMAGE:-slicer-web-slicer-gui-base:local}
    profiles:
      - slicer-gui
    # Image-only target for compose build; do not use as a long-running service.
    entrypoint: ["/bin/true"]
    restart: "no"
    networks:
      - trame-net

  slicer-gui:
    build:
      context: ./slicer-gui-gpu
      dockerfile: Dockerfile
      args:
        SLICER_GUI_BASE_IMAGE: ${SLICER_GUI_BASE_IMAGE:-slicer-web-slicer-gui-base:local}
        SLICER_HEART_VIEWER_REPO: ${SLICER_HEART_VIEWER_REPO:-}
        SLICER_HEART_VIEWER_REF: ${SLICER_HEART_VIEWER_REF:-}
        SLICER_EXTENSIONS: ${SLICER_EXTENSIONS:-}
    image: ${SLICER_GUI_IMAGE:-slicer-web-slicer-gui:local}
    container_name: slicer-gui
    profiles:
      - slicer-gui
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      VNC_PASSWORD: ${VNC_PASSWORD:-}
      VNC_ALLOW_NO_PASSWORD: ${VNC_ALLOW_NO_PASSWORD:-true}
      DISPLAY_WIDTH: ${SLICER_GUI_DISPLAY_WIDTH:-1920}
      DISPLAY_HEIGHT: ${SLICER_GUI_DISPLAY_HEIGHT:-1080}
      SLICER_SIMPLIFIED_VIEWER_PATH: ${SLICER_SIMPLIFIED_VIEWER_PATH:-/opt/slicer-modules/SimplifiedViewer}
      CLOUDFLARE_TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    # No host ports — nginx proxies to slicer-gui:6080 on trame-net (avoids 5901/6080 conflicts)
    volumes:
      - slicer-gui-home:/home/slicer
      - ./data/slicer-gui:/home/slicer/data
      - /dev/shm:/dev/shm
    cap_add:
      - SYS_PTRACE
    shm_size: 8gb
    stdin_open: true
    tty: true
    restart: unless-stopped
    networks:
      - trame-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

networks:
  trame-net:
    name: trame-net
    driver: bridge

volumes:
  slicer-backend-data:
  slicer-gui-home:
  backend-node-modules:
  frontend-node-modules:

# Minimal nginx for GPU node: proxy viewer ports for browser iframes.
# Usage (inside Vast container): nginx -c /workspace/slicer-web/scripts/vast/nginx-gpu-node.conf
# Requires ports 9000-9009 listening on 127.0.0.1 (process runtime).

worker_processes 1;
error_log /var/log/nginx-gpu-error.log;
pid /var/run/nginx-gpu.pid;

events { worker_connections 1024; }

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 2G;

        location ~ ^/trame-session-port/(\d+)(/.*)?$ {
            set $viewer_port $1;
            set $viewer_path $2;
            proxy_pass http://127.0.0.1:$viewer_port$viewer_path$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_read_timeout 86400;
        }

        location /health {
            proxy_pass http://127.0.0.1:8090/health;
        }
    }
}

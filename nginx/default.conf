# SlicerWeb loads ES modules (.mjs); the stock mime.types lacks that extension, and browsers refuse
# a module served as octet-stream. Types added at http level extend the stock map (a types block
# inside a server/location would replace it).
types {
    text/javascript mjs;
}

# WebSocket support
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Client-facing scheme: prefer edge X-Forwarded-Proto, then Cloudflare CF-Visitor, else this hop.
map $http_cf_visitor $forwarded_proto_cf {
    default "";
    ~*"\"scheme\"\s*:\s*\"https\"" https;
    ~*"\"scheme\"\s*:\s*\"http\"" http;
}

map $http_x_forwarded_proto $forwarded_proto {
    ""              $forwarded_proto_cf;
    ~*^https        https;
    ~*^http         http;
    default         $scheme;
}

map $forwarded_proto $forwarded_proto_effective {
    ""      $scheme;
    default $forwarded_proto;
}

server {
    listen 80;
    server_name localhost;

    # Allow large file uploads (medical imaging files can be large)
    client_max_body_size 2G;

    # Include dynamic user locations
    include /etc/nginx/conf.d/users/*.conf;

    # Proxy to Trame container
    location = /trame {
        return 301 /trame/;
    }
    
    location /trame/ {
        resolver 127.0.0.11 valid=10s;
        set $trame_backend trame-user1:8080;
        rewrite ^/trame/$ /index.html break;
        rewrite ^/trame/(.*)$ /$1 break;
        proxy_pass http://$trame_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto_effective;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 86400;
    }

    # Proxy trame sessions through nginx, routing by userId to the correct container
    location ~ ^/trame-session/user-([^/]+)(/.*)?$ {
        resolver 127.0.0.11 valid=10s;
        set $userid $1;
        set $path $2;
        set $container "trame-session-$userid";
        proxy_pass http://$container:9000$path$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto_effective;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 86400;
    }

    # Optional standalone 3D Slicer GUI (compose profile slicer-gui, noVNC on :6080)
    location = /slicer-gui {
        return 301 /slicer-gui/;
    }

    # Per-user Full Slicer seats (My Projects local).
    # Container: slicer-gui-{userId}-seat{n}  URL: /slicer-gui/user-{userId}-seat{n}/...
    location ~ ^/slicer-gui/user-([^/]+)-seat([0-9]+)(/.*)?$ {
        resolver 127.0.0.11 valid=10s;
        set $slicer_gui_user $1;
        set $slicer_gui_seat $2;
        set $slicer_gui_path $3;
        if ($slicer_gui_path = "") {
            set $slicer_gui_path "/";
        }
        set $slicer_gui_session "slicer-gui-$slicer_gui_user-seat$slicer_gui_seat";
        proxy_pass http://$slicer_gui_session:6080$slicer_gui_path$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto_effective;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 86400;
    }

    # Legacy single-seat URLs (pre multi-seat): /slicer-gui/user-{userId}/...
    location ~ ^/slicer-gui/user-([^/]+)(/.*)?$ {
        resolver 127.0.0.11 valid=10s;
        set $slicer_gui_user $1;
        set $slicer_gui_path $2;
        if ($slicer_gui_path = "") {
            set $slicer_gui_path "/";
        }
        set $slicer_gui_session "slicer-gui-$slicer_gui_user";
        proxy_pass http://$slicer_gui_session:6080$slicer_gui_path$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto_effective;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 86400;
    }

    # Shared template/debug service (optional compose profile slicer-gui).
    location /slicer-gui/ {
        resolver 127.0.0.11 valid=10s;
        set $slicer_gui_upstream slicer-gui;
        rewrite ^/slicer-gui/?(.*)$ /$1 break;
        proxy_pass http://$slicer_gui_upstream:6080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto_effective;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 86400;
    }

    # Process runtime: route by assigned viewer port on trame-service
    location ~ ^/trame-session-port/(\d+)(/.*)?$ {
        resolver 127.0.0.11 valid=10s;
        set $viewer_port $1;
        set $viewer_path $2;
        set $viewer_host trame-service;
        proxy_pass http://$viewer_host:$viewer_port$viewer_path$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto_effective;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 86400;
    }

    # Resumable (TUS) uploads for case attachments: stream chunks straight through.
    location ~ ^/api/cases/[^/]+/files/tus(/.*)?$ {
        include /etc/nginx/conf.d/api-proxy.inc;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        client_max_body_size 64m;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }

    # Resumable (TUS) uploads: each PATCH is a single large chunk; limit matches the global 2G cap.
    location /api/directus/files/tus {
        include /etc/nginx/conf.d/api-proxy.inc;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        client_max_body_size 1g;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }

    # Attachment bytes (viewer content + save-to-device download): stream straight through instead of
    # spooling the whole file to nginx's temp disk, and tolerate a paused client. The first request
    # for an uncached file also waits while the backend fetches it from Directus.
    location ~ ^/api/directus/cases/[^/]+/attachments/[^/]+/(download|content)$ {
        include /etc/nginx/conf.d/api-proxy.inc;
        proxy_buffering off;
        proxy_read_timeout 900;
        proxy_send_timeout 900;
        send_timeout 3600;
    }

    # Directus PoC open can download large MRBs + warm Full Slicer (several minutes).
    location /api/directus/ {
        include /etc/nginx/conf.d/api-proxy.inc;
        proxy_read_timeout 900;
        proxy_send_timeout 900;
    }

    # SlicerWeb update endpoint: git clone can take several minutes on first run.
    location /api/slicerweb/check-update {
        resolver 127.0.0.11 valid=10s;
        set $api_upstream backend;
        proxy_pass http://$api_upstream:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto_effective;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 900;
        proxy_send_timeout 900;
    }

    # Variable proxy_pass + resolver so nginx picks up backend IP after container recreate.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api_upstream backend;
        proxy_pass http://$api_upstream:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto_effective;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_request_buffering off;
        proxy_read_timeout 900;
        proxy_send_timeout 900;
    }

    # SlicerWeb: two channels — stable (default) and latest (developer mode).
    # Both are prebuilt static sites populated by scripts/fetch-slicerweb.* --channel <channel>.
    # Same-origin serving lets the embedding page reach frame.contentWindow.slicerWeb.
    location = /slicerweb {
        return 301 /slicerweb/stable/;
    }
    location = /slicerweb/ {
        return 301 /slicerweb/stable/;
    }

    location /slicerweb/stable/ {
        alias /usr/share/slicerweb-stable/;
        index index.html;
        gzip on;
        gzip_types text/javascript application/javascript text/css application/json application/wasm;
        add_header Cache-Control "no-cache";
        location /slicerweb/stable/assets/ {
            alias /usr/share/slicerweb-stable/assets/;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    location /slicerweb/latest/ {
        alias /usr/share/slicerweb-latest/;
        index index.html;
        gzip on;
        gzip_types text/javascript application/javascript text/css application/json application/wasm;
        add_header Cache-Control "no-cache";
        location /slicerweb/latest/assets/ {
            alias /usr/share/slicerweb-latest/assets/;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    # Variable upstream + resolver so nginx picks up frontend IP after container recreate.
    location / {
        resolver 127.0.0.11 valid=10s;
        set $frontend_upstream frontend;
        proxy_pass http://$frontend_upstream:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto_effective;
        proxy_read_timeout 300;
        proxy_redirect off;
    }
}
# WebSocket support
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Preserve client scheme from an edge proxy (e.g. cloudflared) instead of only the nginx↔client hop ($scheme is often http).
map $http_x_forwarded_proto $forwarded_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

server {
    listen 80;
    server_name localhost;

    # Allow large file uploads (medical imaging files can be large)
    client_max_body_size 2G;

    # Include dynamic user locations
    include /etc/nginx/conf.d/users/*.conf;

    # Proxy to Trame container
    location = /trame {
        return 301 /trame/;
    }
    
    location /trame/ {
        resolver 127.0.0.11 valid=10s;
        set $trame_backend trame-user1:8080;
        rewrite ^/trame/$ /index.html break;
        rewrite ^/trame/(.*)$ /$1 break;
        proxy_pass http://$trame_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # Proxy trame sessions through nginx, routing by userId to the correct container
    location ~ ^/trame-session/user-([^/]+)(/.*)?$ {
        resolver 127.0.0.11 valid=10s;
        set $userid $1;
        set $path $2;
        set $container "trame-session-$userid";
        proxy_pass http://$container:9000$path$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }

    location / {
        proxy_pass http://frontend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 300;
        proxy_redirect off;
    }
}
# nginx/ovh.conf — OVH VPS nginx configuration
#
# Differences from default.conf (Paperspace all-in-one):
#   - The static /trame-session/ location block is REMOVED.
#     Per-user location blocks are written dynamically by PaperspaceProvider
#     into /etc/nginx/conf.d/users/ and included below.
#   - server_name is a wildcard to work with any OVH VPS hostname / IP.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Allow large file uploads (medical imaging files can be large)
    client_max_body_size 2G;

    # ── Dynamic per-user trame session routes ──────────────────────────
    # Each active Paperspace session gets its own file written here by
    # PaperspaceProvider._write_nginx_conf().  Files look like:
    #   location ~ ^/trame-session/user-42(/.*)?$ {
    #       proxy_pass http://PAPERSPACE_VM_IP:9001$path$is_args$args;
    #       ...
    #   }
    # nginx is reloaded (SIGHUP) after each write/remove so routes take
    # effect immediately without restarting the container.
    include /etc/nginx/conf.d/users/*.conf;

    # ── Backend API ────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }

    # ── Frontend (LitElement dev server) ──────────────────────────────
    location / {
        proxy_pass http://frontend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_redirect off;
        proxy_read_timeout 86400;
    }
}
